name: Rust backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/rust-backend.yml"
      - "app/**"
      - "data/**"
      - "lib/**"
      - "tests/**"
      - "worker/**"
      - "scripts/**"
      - "cloudflare-workers.d.ts"
      - "worker-configuration.d.ts"
      - "wrangler.jsonc"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "app/**"
      - "data/**"
      - "lib/**"
      - "tests/**"
      - "worker/**"
      - "scripts/**"
      - "cloudflare-workers.d.ts"
      - "worker-configuration.d.ts"
      - "wrangler.jsonc"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check generated Cloudflare binding types
        run: pnpm run cf:types:check
      - name: Lint frontend and integration files
        run: pnpm exec eslint app lib scripts tests worker cloudflare-workers.d.ts --ignore-pattern dist --ignore-pattern .next
      - run: pnpm run build
      - run: node --test tests/rendered-html.test.mjs
