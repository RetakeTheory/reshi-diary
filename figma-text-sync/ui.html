<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>同步网站文字</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--figma-color-bg, #fff); color: var(--figma-color-text, #1e1e1e); font-size: 12px; }
      button { font: inherit; }
      .panel { min-height: 520px; display: flex; flex-direction: column; padding: 20px; }
      h1 { margin: 0; font-size: 20px; line-height: 1.3; letter-spacing: -.02em; }
      .summary { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-top: 8px; color: var(--figma-color-text-secondary, #6b6b6b); }
      .summary strong { color: var(--figma-color-text, #1e1e1e); font-size: 14px; font-variant-numeric: tabular-nums; }
      .notice { margin: 16px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--figma-color-bg-secondary, #f5f5f5); color: var(--figma-color-text-secondary, #6b6b6b); line-height: 1.55; }
      .preview { flex: 1; min-height: 0; margin-top: 18px; }
      .preview h2 { margin: 0 0 8px; font-size: 12px; font-weight: 650; }
      .list { max-height: 260px; margin: 0; padding: 0; overflow-y: auto; list-style: none; scrollbar-color: var(--figma-color-border, #d8d8d8) transparent; }
      .item { padding: 11px 0; border-top: 1px solid var(--figma-color-border, #e5e5e5); }
      .item:first-child { border-top: 0; }
      .path { display: block; margin-bottom: 5px; color: var(--figma-color-text-brand, #5b5bd6); font-size: 10px; font-weight: 600; }
      .value { display: -webkit-box; overflow: hidden; color: var(--figma-color-text, #1e1e1e); line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
      .empty { padding: 34px 12px; border: 1px dashed var(--figma-color-border, #d8d8d8); border-radius: 8px; color: var(--figma-color-text-secondary, #6b6b6b); text-align: center; line-height: 1.6; }
      .status { min-height: 38px; margin: 14px 0 10px; padding: 10px 12px; border-radius: 8px; background: var(--figma-color-bg-secondary, #f5f5f5); color: var(--figma-color-text-secondary, #6b6b6b); line-height: 1.5; }
      .status[data-state="success"] { background: var(--figma-color-bg-success, #eaf7ee); color: var(--figma-color-text-success, #14753c); }
      .status[data-state="error"] { background: var(--figma-color-bg-danger, #fff0f0); color: var(--figma-color-text-danger, #b42318); }
      .sync { width: 100%; min-height: 42px; border: 0; border-radius: 8px; background: var(--figma-color-bg-brand, #5b5bd6); color: var(--figma-color-text-onbrand, #fff); cursor: pointer; font-weight: 600; transition: filter .16s ease, transform .16s ease; }
      .sync:hover:not(:disabled) { filter: brightness(1.08); }
      .sync:active:not(:disabled) { transform: translateY(1px); }
      .sync:focus-visible { outline: 2px solid var(--figma-color-border-brand-strong, #5b5bd6); outline-offset: 2px; }
      .sync:disabled { cursor: not-allowed; opacity: .48; }
      ::selection { background: var(--figma-color-bg-brand, #5b5bd6); color: var(--figma-color-text-onbrand, #fff); }
      @media (prefers-reduced-motion: reduce) { .sync { transition: none; } }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>同步网站文字</h1>
      <div class="summary"><span>当前页面</span><strong id="count">0 个可同步文字</strong></div>
      <p class="notice" id="notice">只读取名称匹配映射的 Text 图层；坐标、样式、布局和其他节点不会发送。</p>

      <section class="preview" aria-labelledby="preview-title">
        <h2 id="preview-title">修改内容预览</h2>
        <ul class="list" id="list"></ul>
        <p class="empty" id="empty">未识别到可同步图层。请将 Text 图层命名为 EDIT/home.hero.*。</p>
      </section>

      <div class="status" id="status" data-state="idle" role="status" aria-live="polite">等待同步</div>
      <button class="sync" id="sync" type="button" disabled>同步到网站</button>
    </main>

    <script>
      const count = document.getElementById("count");
      const empty = document.getElementById("empty");
      const list = document.getElementById("list");
      const notice = document.getElementById("notice");
      const status = document.getElementById("status");
      const syncButton = document.getElementById("sync");
      let currentScan = { duplicates: [], ignored: [], items: [] };
      let busy = false;

      function send(type) {
        parent.postMessage({ pluginMessage: { type } }, "*");
      }

      function setStatus(state, message) {
        busy = state === "loading";
        status.dataset.state = state;
        status.textContent = message;
        syncButton.disabled = busy || currentScan.items.length === 0 || currentScan.duplicates.length > 0;
        syncButton.textContent = busy ? "正在同步…" : "同步到网站";
      }

      function renderScan(scan) {
        currentScan = scan;
        count.textContent = `${scan.recognizedCount} 个可同步文字`;
        list.replaceChildren();
        for (const item of scan.items) {
          const row = document.createElement("li");
          row.className = "item";
          const path = document.createElement("span");
          path.className = "path";
          path.textContent = item.field;
          const value = document.createElement("span");
          value.className = "value";
          value.textContent = item.value || "（空文字）";
          row.append(path, value);
          list.append(row);
        }
        empty.hidden = scan.items.length > 0;

        const warnings = [];
        if (scan.duplicates.length) warnings.push(`重名：${scan.duplicates.join("、")}`);
        if (scan.ignored.length) warnings.push(`${scan.ignored.length} 个未知 EDIT/ 图层已忽略`);
        notice.textContent = warnings.length
          ? warnings.join("；")
          : "只读取名称匹配映射的 Text 图层；坐标、样式、布局和其他节点不会发送。";
        syncButton.disabled = busy || scan.items.length === 0 || scan.duplicates.length > 0;
      }

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;
        if (message.type === "scan-result") renderScan(message);
        if (message.type === "sync-status") setStatus(message.state, message.message);
      };

      syncButton.addEventListener("click", () => send("sync"));
      send("scan");
    </script>
  </body>
</html>
